<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    ARINC763Forge Pro (v1.0.0) Architecture &amp; Tri-Domain Routing
  </text>
  <text x="480" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">
    Aircraft Network Server System (NSS) | ARINC Characteristic 763-4, RTCA DO-326A &amp; IEEE 802.1Q
  </text>

  <!-- Block 1: Aircraft Control Domain (ACD) -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#7f1d1d"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fecaca">AIRCRAFT CONTROL (ACD)</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• Primary Flight Control Laws</text>
    <text x="20" y="105" font-family="monospace" font-size="12" fill="#cbd5e1">• Flight Management (FMC 1/2)</text>
    <text x="20" y="135" font-family="monospace" font-size="12" fill="#cbd5e1">• Air Data &amp; Inertial (ADIRS)</text>
    <text x="20" y="165" font-family="monospace" font-size="12" fill="#cbd5e1">• Engine FADEC Telemetry</text>
    <text x="20" y="195" font-family="monospace" font-size="12" fill="#cbd5e1">• ARINC 664 (AFDX) Avionics</text>
    <text x="20" y="225" font-family="monospace" font-size="12" fill="#cbd5e1">• ARINC 429 Digital Buses</text>
    <text x="20" y="255" font-family="monospace" font-size="12" fill="#cbd5e1">• IEEE 802.1Q VLAN 10</text>
    <text x="20" y="285" font-family="monospace" font-size="12" fill="#cbd5e1">• DO-326A Zero Ingress Rule</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#450a0a" stroke="#f43f5e"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#f87171">DAL-A CRITICAL SAFETY</text>
  </g>

  <!-- Block 2: ARINC 763 Network Server System (NSS) Core -->
  <g transform="translate(350, 110)" filter="url(#shadow)">
    <rect width="260" height="370" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="40" rx="8" fill="url(#cyanGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">ARINC 763 NSS ROUTER</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#e2e8f0">• Multi-Domain State Firewall</text>
    <text x="20" y="105" font-family="monospace" font-size="12" fill="#e2e8f0">• Unidirectional Data Diode</text>
    <text x="35" y="125" font-family="monospace" font-size="11" fill="#94a3b8">- ACD -&gt; AISD Forward Only</text>
    <text x="20" y="155" font-family="monospace" font-size="12" fill="#e2e8f0">• IEEE 802.1Q VLAN Isolation</text>
    <text x="20" y="185" font-family="monospace" font-size="12" fill="#e2e8f0">• Terminal Wireless (TWLAN)</text>
    <text x="35" y="205" font-family="monospace" font-size="11" fill="#94a3b8">- GigaWave 802.11ax / 5G</text>
    <text x="20" y="235" font-family="monospace" font-size="12" fill="#e2e8f0">• WOW In-Flight Radio Inhibit</text>
    <text x="20" y="265" font-family="monospace" font-size="12" fill="#e2e8f0">• ARINC 665 / 615A Software Sync</text>
    <text x="20" y="295" font-family="monospace" font-size="12" fill="#e2e8f0">• RFC 5424 Syslog Audit Logger</text>
    <rect x="20" y="325" width="220" height="30" rx="4" fill="#172554" stroke="#3b82f6"/>
    <text x="130" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#60a5fa">DO-326A AIRWORTHINESS GATE</text>
  </g>

  <!-- Block 3: Operational & Cabin Domains (AISD & PIESD) -->
  <g transform="translate(670, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a855f7">AISD &amp; PASSENGER (PIESD)</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• AISD (VLAN 20):</text>
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">- Electronic Flight Bag (EFB)</text>
    <text x="35" y="115" font-family="monospace" font-size="11" fill="#94a3b8">- QAR / FOQA Data Offload</text>
    <text x="35" y="135" font-family="monospace" font-size="11" fill="#94a3b8">- Electronic Tech Log (ETL)</text>
    <text x="20" y="175" font-family="monospace" font-size="12" fill="#cbd5e1">• PIESD (VLAN 30):</text>
    <text x="35" y="195" font-family="monospace" font-size="11" fill="#94a3b8">- Passenger In-Flight Wi-Fi</text>
    <text x="35" y="215" font-family="monospace" font-size="11" fill="#94a3b8">- Seatback IFE Systems</text>
    <text x="35" y="235" font-family="monospace" font-size="11" fill="#94a3b8">- Cabin Internet Modem</text>
    <text x="20" y="275" font-family="monospace" font-size="12" fill="#cbd5e1">• Complete Domain Separation</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#3b0764" stroke="#a855f7"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#d8b4fe">AIRLINE &amp; CABIN SERVICES</text>
  </g>

  <!-- Connectors -->
  <line x1="290" y1="295" x2="350" y2="295" stroke="#f43f5e" stroke-width="2"/>
  <line x1="610" y1="295" x2="670" y2="295" stroke="#06b6d4" stroke-width="2"/>
</svg>