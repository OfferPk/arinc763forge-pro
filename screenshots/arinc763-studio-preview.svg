<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#studioBg)"/>

  <!-- Window Header -->
  <rect width="1000" height="50" fill="#111827" stroke="#1f293d" stroke-width="1"/>
  <circle cx="25" cy="25" r="6" fill="#f43f5e"/>
  <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="31" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    ARINC763Forge Pro — Aircraft Network Server System Studio (v1.0.0)
  </text>
  <rect x="730" y="14" width="245" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
  <text x="852" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">
    DO-326A TRI-DOMAIN ISOLATED
  </text>

  <!-- Left: Packet Generator & Controls -->
  <rect x="20" y="70" width="280" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="35" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">NETWORK ROUTER CONTROLS</text>

  <rect x="35" y="120" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="142" font-family="sans-serif" font-size="12" fill="#e2e8f0">Source: PIESD (VLAN 30)</text>

  <rect x="35" y="170" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="192" font-family="sans-serif" font-size="12" fill="#e2e8f0">Destination: ACD (Flight Controls)</text>

  <rect x="35" y="220" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="242" font-family="sans-serif" font-size="12" fill="#e2e8f0">Target Port: 80 (HTTP Traversal)</text>

  <rect x="35" y="270" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="292" font-family="sans-serif" font-size="12" fill="#e2e8f0">Aircraft: A6-EEO (A380-800)</text>

  <rect x="35" y="320" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="342" font-family="sans-serif" font-size="12" fill="#e2e8f0">Gatelink: 802.11ax Connected</text>

  <rect x="35" y="380" width="250" height="40" rx="4" fill="#06b6d4"/>
  <text x="160" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">
    INJECT PACKET &amp; AUDIT
  </text>

  <!-- Center: Topology Visualizer & Telemetry -->
  <rect x="320" y="70" width="370" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="335" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">DO-326A FIREWALL &amp; DATA DIODE</text>

  <!-- Visual Canvas -->
  <rect x="335" y="120" width="340" height="200" rx="4" fill="#040812" stroke="#1e293b"/>
  <!-- Domain boxes -->
  <rect x="350" y="145" width="80" height="110" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="390" y="165" text-anchor="middle" fill="#f43f5e" font-size="9" font-family="monospace">ACD (VLAN 10)</text>
  <text x="390" y="185" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">Flight Controls</text>
  <text x="390" y="200" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">FMC/ADIRS</text>
  <text x="390" y="235" text-anchor="middle" fill="#f87171" font-size="7" font-family="monospace">DAL-A SAFE</text>

  <rect x="460" y="160" width="90" height="80" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
