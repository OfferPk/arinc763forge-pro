  <text x="505" y="200" text-anchor="middle" fill="#10b981" font-size="8" font-family="monospace">DATA DIODE</text>
  <text x="505" y="225" text-anchor="middle" fill="#38bdf8" font-size="8" font-family="monospace">FIREWALL ON</text>

  <rect x="580" y="135" width="80" height="55" rx="4" fill="#1e293b" stroke="#38bdf8"/>
  <text x="620" y="155" text-anchor="middle" fill="#38bdf8" font-size="8" font-family="monospace">AISD (VLAN 20)</text>
  <text x="620" y="175" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="monospace">EFB / QAR Offload</text>

  <rect x="580" y="205" width="80" height="55" rx="4" fill="#1e293b" stroke="#a855f7"/>
  <text x="620" y="225" text-anchor="middle" fill="#a855f7" font-size="8" font-family="monospace">PIESD (VLAN 30)</text>
  <text x="620" y="245" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="monospace">Passenger Wi-Fi</text>

  <text x="350" y="305" font-family="monospace" font-size="9" fill="#10b981">GATELINK: 802.11AX CONNECTED | QAR SYNC: ACTIVE</text>

  <text x="335" y="350" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">ARINC 429 &amp; AFDX GATEWAY WORDS</text>
  <rect x="335" y="370" width="340" height="185" rx="4" fill="#090e18" stroke="#1e293b"/>
  <text x="350" y="395" font-family="monospace" font-size="11" fill="#38bdf8">110 GPS LATITUDE : 0x71F53412 (ODD PARITY)</text>
  <text x="350" y="425" font-family="monospace" font-size="11" fill="#38bdf8">112 GROUND SPEED : 0x6001C012 (TAXI 14 KTS)</text>
  <text x="350" y="455" font-family="monospace" font-size="11" fill="#10b981">270 NSS DISCRETE : 0x830000B8 (GATEWAY OK)</text>
  <text x="350" y="485" font-family="monospace" font-size="11" fill="#10b981">377 EQUIP IDENT  : 0x805047FF (A350-NSS)</text>
  <text x="350" y="515" font-family="monospace" font-size="11" fill="#f43f5e">DO-326A PACKET DROP: PIESD -&gt; ACD [VIOLATION]</text>

  <!-- Right: Auditor -->
  <rect x="710" y="70" width="270" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="725" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">10-POINT NORMATIVE AUDIT</text>

  <g transform="translate(725, 120)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. Tri-Domain Segregation</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 160)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. DO-326A Ingress Drop</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 200)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">3. Unidirectional Diode</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 240)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">4. 802.1Q VLAN Tagging</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 280)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">5. TWLAN Gatelink Auto-Sync</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 320)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">6. WOW In-Flight Inhibit</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 360)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">7. ARINC 665 Part Ingest</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 400)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">8. RFC 5424 Syslog Audit</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 440)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">9. ARINC 429 Bit 32 Parity</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 480)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">10. Boeing/Airbus NSS Interop</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
</svg>